name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: 28.2.13676358
  # Each job installs only the tools it needs; `mise run` would otherwise install all of mise.toml.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  native:
    name: Native bridge (Go tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          install_args: go rclone
      - name: gofmt
        working-directory: native
        run: test -z "$(gofmt -l .)"
      - name: Third-party license list is up to date
        run: |
          tools/generate-licenses.sh
          git diff --exit-code app/assets/licenses/go.txt
      - run: mise run test:native

  linux:
    name: Linux (tier 1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsecret-1-dev libegl1 libgles2 libgl1-mesa-dri dbus gnupg
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          install_args: go flutter cmake ninja conda:clang rclone
      - name: Build libcryptdrive.so
        run: mise run native:linux
      - name: Analyze
        working-directory: app
        run: |
          flutter pub get
          dart format --set-exit-if-changed lib test integration_test packages/cryptdrive_native/lib packages/cryptdrive_native/test
          flutter analyze
          (cd packages/cryptdrive_native && flutter analyze)
      - name: Unit tests and encrypted round-trip (local crypt remote, rclone CLI compatibility)
        run: mise run test:app
      - name: App flow on the Linux desktop (headless Wayland + Secret Service)
        working-directory: app
        run: ../tools/linux-headless.sh flutter test integration_test/app_flow_test.dart -d linux
      - name: Build release bundle and AppImage
        working-directory: app
        run: |
          flutter build linux --release
          ../tools/package-appimage.sh
          tar -czf build/CryptDrive-linux-x86_64.tar.gz -C build/linux/x64/release --transform 's,^bundle,CryptDrive,' bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cryptdrive-linux-x86_64
          path: |
            app/build/CryptDrive-x86_64.AppImage
            app/build/CryptDrive-linux-x86_64.tar.gz
          if-no-files-found: error

  android:
    name: Android (tier 1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        # The runner's preinstalled SDKs leave too little room for mise's Android SDK, the NDK and Gradle.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          install_args: go flutter java android-sdk
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-36" "platforms/android-37.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
      - name: Build libcryptdrive.so for every ABI
        run: mise run native:android
      - name: Build release APK (all ABIs)
        working-directory: app
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/CryptDrive-android.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cryptdrive-android-apk
          path: app/build/CryptDrive-android.apk
          if-no-files-found: error

  android-emulator:
    name: Android emulator app flow (tier 1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        # The runner's preinstalled SDKs leave too little room for mise's Android SDK, the NDK and Gradle.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          install_args: go flutter java android-sdk
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platform-tools" "platforms;android-36" "platforms/android-37.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}" "emulator" "system-images;android-30;default;x86_64"
      - name: Build libcryptdrive.so (x86_64 emulator ABI)
        run: native/build.sh android x86_64
      - name: Run the app flow integration test on an emulator
        run: tools/android-integration-test.sh integration_test/app_flow_test.dart

  web:
    name: Web app and container image (tier 1)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          install_args: go flutter node
      - name: Build the browser engine and check it under Node
        run: mise run test:web-engine
      - name: App flow in headless Chrome (WebAssembly engine in a worker)
        # The runner image ships Chrome and the matching chromedriver; chromedriver picks that Chrome.
        run: CHROME="$(command -v google-chrome)" CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver" tools/web-integration-test.sh
      - name: Build the web app
        working-directory: app
        run: |
          flutter build web --release --no-web-resources-cdn
          tar -czf build/CryptDrive-web.tar.gz -C build --transform 's,^web,CryptDrive-web,' web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cryptdrive-web
          path: app/build/CryptDrive-web.tar.gz
          if-no-files-found: error
      - name: Build the web app for GitHub Pages (served under /<repository>/)
        if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_PAGES == 'true'
        working-directory: app
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: flutter build web --release --no-web-resources-cdn --base-href "/$REPOSITORY_NAME/" --output build/pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_PAGES == 'true'
        with:
          path: app/build/pages
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/its-alex/cryptdrive-web
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build (and on tags, push) the container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # Otherwise the build record is uploaded as an artifact and ends up in the release.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: deploy/web
          file: deploy/web/Dockerfile
          build-contexts: site=app/build/web
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}

  pages:
    name: GitHub Pages
    # Opt-in: set the repository variable DEPLOY_PAGES=true once Pages uses "GitHub Actions" as its source.
    if: startsWith(github.ref, 'refs/tags/v') && vars.DEPLOY_PAGES == 'true'
    needs: web
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  windows:
    name: Windows (tier 2, experimental)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Put MinGW gcc on PATH for cgo
        shell: msys2 {0}
        run: cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          install_args: go flutter
      - name: Build cryptdrive.dll
        run: native/build.sh windows-x64
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - name: Package (installer, zip)
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || choco install innosetup --yes --no-progress > /dev/null
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)"
          "$iscc" /Q "/DAppVersion=$version" tools/windows-installer.iss
          (cd app/build/windows/x64/runner/Release && 7z a -tzip ../../../../CryptDrive-windows-x64.zip . > /dev/null)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cryptdrive-windows
          path: |
            app/build/CryptDrive-windows-x64-setup.exe
            app/build/CryptDrive-windows-x64.zip
          if-no-files-found: error

  release:
    name: GitHub release
    # Tier 1 must pass; experimental platforms are attached when they built.
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.native.result == 'success' && needs.linux.result == 'success'
      && needs.android.result == 'success' && needs.android-emulator.result == 'success'
      && needs.web.result == 'success'
    needs: [native, linux, android, android-emulator, web, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: cryptdrive-*
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "CryptDrive $GITHUB_REF_NAME" --notes-file .github/release-notes.md --generate-notes --prerelease
